name: AIoT Solution CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Keo ma nguon ve may ao Runner
        uses: actions/checkout@v4

      - name: 2. Cai dat Python 3.10 va luu cache pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Cai dat thu vien, goi aiot_pkg (-e .) va cong cu ML/CV/IDP/Serving/QA
        run: |
          pip install -r requirements.txt
          pip install scikit-learn matplotlib shap mlflow opencv-python-headless pyyaml rapidocr-onnxruntime fastapi sqlalchemy httpx ruff mypy pytest
          pip install -e .

      - name: 4. Kiem tra chat luong code va kieu tinh (Ruff & Mypy)
        run: |
          ruff check aiot_pkg model_evaluation_report.py cv_yolo_custom.py idp_invoice_pipeline.py inference_service.py transformer_text_classifier.py test_solution.py
          ruff format --check aiot_pkg model_evaluation_report.py cv_yolo_custom.py idp_invoice_pipeline.py inference_service.py transformer_text_classifier.py test_solution.py
          mypy aiot_pkg model_evaluation_report.py cv_yolo_custom.py idp_invoice_pipeline.py inference_service.py transformer_text_classifier.py test_solution.py

      - name: 5. Chay kiem thu tu dong (Unit Test voi Pytest)
        run: pytest -v test_solution.py

  build-docker-image:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: 1. Keo ma nguon
        uses: actions/checkout@v4

      - name: 2. Build Multi-stage Docker Image va Gan Tag v1.2.1
        run: |
          docker build -t aiot-cleaner:v1.2.1 -t aiot-cleaner:sha-${{ github.sha }} .
          docker images | grep aiot-cleaner
